services:
  wickedyoda-gui2:
    image: wickedyoda-bot:gui2-preview
    pull_policy: never
    container_name: wickedyoda-gui2-preview
    env_file:
      - env.env
    environment:
      DATA_DIR: /app/data
      LOG_DIR: /logs
      TZ: ${TZ:-UTC}
      WEB_GUI_VARIANT: v2
    ports:
      # Bound to 127.0.0.1 only - reach via Tailscale or SSH tunnel to test
      - "127.0.0.1:9081:8080"
    volumes:
      # Separate storage dirs so the preview doesn't clobber production data
      - /root/docker/wickedyodabot-gui2/data:/app/data
      - /root/docker/wickedyodabot-gui2/logs:/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
