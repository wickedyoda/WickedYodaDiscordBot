name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@284c089a1c4d8e8673b7398cdb8df358a9de47ad # v5
        with:
          fail-on-severity: high
