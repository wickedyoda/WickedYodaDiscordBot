name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        id: gitleaks
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            zricethezav/gitleaks:v8.24.3 \
            detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif
          scan_exit_code=$?
          if [ ! -f gitleaks.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"trivy","informationUri":"https://github.com/aquasecurity/trivy","rules":[]}},"results":[]}]}' > gitleaks.sarif
          fi
          echo "scan_exit_code=${scan_exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: gitleaks.sarif

      - name: Fail on leaks
        if: steps.gitleaks.outputs.scan_exit_code != '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: exit 1

      - name: Non-blocking leaks notice (non-main)
        if: steps.gitleaks.outputs.scan_exit_code != '0' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        run: echo "::warning::Gitleaks findings detected. SARIF was uploaded; non-blocking outside direct pushes to main."

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        id: trivy_fs
        run: |
          set +e
          scan_exit_code=0
          for attempt in 1 2; do
            docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.56.1 \
            fs \
            --severity HIGH,CRITICAL \
            --scanners vuln,misconfig,secret \
            --ignore-unfixed \
            --format sarif \
            --output trivy-fs.sarif \
            --exit-code 1 \
            .
            scan_exit_code=$?
            if [ -f trivy-fs.sarif ]; then
              break
            fi
            echo "::warning::trivy-fs: no report produced (attempt ${attempt}); retrying after a pause."
            sleep 15
          done
          if [ -f trivy-fs.sarif ]; then
            echo "scan_ran=true" >> "$GITHUB_OUTPUT"
          else
            # A valid empty report, so the upload step succeeds, and scan_ran=false so
            # the job still fails: a scan that never ran must not look green.
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"trivy","informationUri":"https://github.com/aquasecurity/trivy","rules":[]}},"results":[]}]}' > trivy-fs.sarif
            echo "scan_ran=false" >> "$GITHUB_OUTPUT"
          fi
          echo "scan_exit_code=${scan_exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload FS scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-fs.sarif

      - name: Fail when the scan could not run
        if: steps.trivy_fs.outputs.scan_ran != 'true'
        run: |
          echo "::error::Trivy produced no report, so this scan did not run. Check the database download above."
          exit 1

      - name: Fail on vulnerabilities
        if: steps.trivy_fs.outputs.scan_exit_code != '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: exit 1

      - name: Non-blocking findings notice (non-main)
        if: steps.trivy_fs.outputs.scan_exit_code != '0' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        run: echo "::warning::Trivy filesystem findings detected. SARIF was uploaded; non-blocking outside direct pushes to main."

  trivy-image:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build local image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: wickedyoda-little-helper:scan
          push: false

      - name: Trivy image scan
        id: trivy_image
        run: |
          set +e
          scan_exit_code=0
          for attempt in 1 2; do
            docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.56.1 \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image.sarif \
            --exit-code 1 \
            wickedyoda-little-helper:scan
            scan_exit_code=$?
            if [ -f trivy-image.sarif ]; then
              break
            fi
            echo "::warning::trivy-image: no report produced (attempt ${attempt}); retrying after a pause."
            sleep 15
          done
          if [ -f trivy-image.sarif ]; then
            echo "scan_ran=true" >> "$GITHUB_OUTPUT"
          else
            # A valid empty report, so the upload step succeeds, and scan_ran=false so
            # the job still fails: a scan that never ran must not look green.
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"trivy","informationUri":"https://github.com/aquasecurity/trivy","rules":[]}},"results":[]}]}' > trivy-image.sarif
            echo "scan_ran=false" >> "$GITHUB_OUTPUT"
          fi
          echo "scan_exit_code=${scan_exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-image.sarif

      - name: Fail when the scan could not run
        if: steps.trivy_image.outputs.scan_ran != 'true'
        run: |
          echo "::error::Trivy produced no report, so this scan did not run. Check the database download above."
          exit 1

      - name: Fail on vulnerabilities
        if: steps.trivy_image.outputs.scan_exit_code != '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: exit 1

      - name: Non-blocking findings notice (non-main)
        if: steps.trivy_image.outputs.scan_exit_code != '0' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        run: echo "::warning::Trivy image findings detected. SARIF was uploaded; non-blocking outside direct pushes to main."
